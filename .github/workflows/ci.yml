name: static-site-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out generated site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Reject whitespace and patch corruption
        run: git diff --check HEAD^
        if: github.event_name == 'push'

      - name: Validate generated static artifact
        run: node scripts/validate-static-site.mjs
